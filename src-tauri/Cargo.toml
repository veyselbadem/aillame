[package]
name = "aillame"
version = "1.3.0"
description = "Aillame Desktop Shell"
authors = ["Aillame Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# default enables primate-rendering (port of webview2)
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
